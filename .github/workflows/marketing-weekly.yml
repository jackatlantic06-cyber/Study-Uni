name: Marketing — weekly research + create

# Monday 06:00 Irish time. GitHub cron is UTC only, so it fires at 05:00 and
# 06:00 UTC and the first step skips whichever run isn't 06:00 in Dublin
# (06:00 UTC in winter, 05:00 UTC in summer).
on:
  schedule:
    - cron: '0 5 * * 1'
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: 'Redo even if this week already has a brief/posts'
        type: boolean
        default: false

concurrency:
  group: marketing-weekly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: marketing
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}          # optional
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}  # optional
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}        # optional, repo variable
      FAL_KEY: ${{ secrets.FAL_KEY }}                             # cartoon scenes + animation
    steps:
      - name: Only run at 06:00 Irish time
        id: gate
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          H=$(TZ=Europe/Dublin date +%H)
          echo "Dublin hour: $H"
          if [ "$H" = "06" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: marketing/package-lock.json

      - run: npm ci --no-audit --no-fund
        if: steps.gate.outputs.go == 'true'

      - name: Research
        if: steps.gate.outputs.go == 'true'
        run: node jobs/research.js ${{ inputs.force && '--force' || '' }}

      - name: Create drafts
        if: steps.gate.outputs.go == 'true'
        run: node jobs/create.js ${{ inputs.force && '--force' || '' }}

      - name: Render images, voiceover and videos
        if: steps.gate.outputs.go == 'true'
        run: node jobs/render.js
