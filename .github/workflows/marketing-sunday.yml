name: Marketing — Sunday learning

# Sunday 20:00 Irish time: rank last week's posts (sign-ups, then views),
# write the "what worked" note and set next week's mix for Monday.
on:
  schedule:
    - cron: '0 19 * * 0'
    - cron: '0 20 * * 0'
  workflow_dispatch:

concurrency:
  group: marketing-learn
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: marketing
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      POSTIZ_API_KEY: ${{ secrets.POSTIZ_API_KEY }}
    steps:
      - name: Only run at 20:00 Irish time
        id: gate
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          H=$(TZ=Europe/Dublin date +%H)
          if [ "$H" = "20" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: marketing/package-lock.json
      - run: npm ci --no-audit --no-fund --ignore-scripts
        if: steps.gate.outputs.go == 'true'
      - run: node jobs/learn.js
        if: steps.gate.outputs.go == 'true'
